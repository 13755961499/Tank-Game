<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 - Tank Game (Pro)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <!-- 开始界面 -->
            <div id="start-screen" class="overlay">
                <h1>坦克大战</h1>
                <div class="menu">
                    <button id="start-btn">单人模式</button>
                    <button id="multi-btn" class="secondary">网络对战</button>
                    <div class="instructions">
                        <p>方向键: 移动</p>
                        <p>空格键: 射击</p>
                        <p>ESC: 暂停</p>
                        <p class="feature-note">特性：子弹可以相互抵消</p>
                    </div>
                </div>
            </div>

            <!-- 暂停界面 -->
            <div id="pause-screen" class="overlay hidden">
                <h1>游戏暂停</h1>
                <button id="resume-btn">继续游戏</button>
            </div>

            <!-- 结算界面 -->
            <div id="game-over-screen" class="overlay hidden">
                <h1 id="game-over-title">游戏结束</h1>
                <div class="stats-box">
                    <p>最终得分: <span id="final-score">0</span></p>
                    <p>最高得分: <span id="high-score-over">0</span></p>
                </div>
                <button id="restart-btn">重新开始</button>
            </div>

            <!-- 实时数据面板 -->
            <div id="hud">
                <div class="hud-item">
                    <span class="label">HP:</span>
                    <span id="hp-value">3</span>
                </div>
                <div class="hud-item">
                    <span class="label">SCORE:</span>
                    <span id="score-value">0</span>
                </div>
                <div class="hud-item">
                    <span class="label">BEST:</span>
                    <span id="high-score-value">0</span>
                </div>
                <div class="hud-item">
                    <span class="label">LV:</span>
                    <span id="level-value">1</span>
                </div>
                <div class="hud-item">
                    <span class="label">WAVE:</span>
                    <span id="wave-value">1</span>
                </div>
                <div class="hud-item hidden" id="boss-hp-hud">
                    <span class="label">BOSS:</span>
                    <span id="boss-hp-value">0</span>
                </div>
            </div>
            <div id="wave-banner" class="wave-banner hidden" aria-live="polite"></div>
            <div id="upgrade-screen" class="overlay hidden">
                <h2>选择本波升级</h2>
                <p>下一波开始前选择一个强化</p>
                <div class="upgrade-options">
                    <button class="upgrade-button" data-upgrade="speed">
                        机动强化
                        <small>移动速度 +0.5</small>
                    </button>
                    <button class="upgrade-button" data-upgrade="fire">
                        火力强化
                        <small>射击冷却 -60ms</small>
                    </button>
                    <button class="upgrade-button" data-upgrade="armor">
                        装甲强化
                        <small>最大生命 +1 并恢复</small>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本加载 -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/config.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/sprite.js"></script>
    <!-- 实体类 -->
    <script src="js/tank.js"></script>
    <script src="js/powerup.js"></script>
    <!-- 地图系统 -->
    <script src="js/map.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
